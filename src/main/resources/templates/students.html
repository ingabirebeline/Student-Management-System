<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registered Students</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container">
    <h1>Registered Students</h1>

    <p class="error" th:if="${message}" th:text="${message}"></p>

    <p th:if="${#lists.isEmpty(students) and message == null}">No students registered yet.</p>

    <div class="table-wrap" th:unless="${#lists.isEmpty(students)}">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Age</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td th:text="${student.firstName}"></td>
                <td th:text="${student.lastName}"></td>
                <td th:text="${student.email}"></td>
                <td th:text="${student.age}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="link"><a th:href="@{/student/register}">Register a new student</a></p>
    <p class="link"><a th:href="@{/student/all}">View all students</a></p>
</div>
</body>
</html>
